<!DOCTYPE html>
<html>
<head>
    <title>Download Your Photo</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #0088cc;
            --accent: #ff914d;
            --bg: #e0f2fe;
        }

        body { 
            text-align: center; 
            background: var(--bg);
            color: #1e293b; 
            font-family: 'Montserrat', sans-serif; 
            padding: 20px; 
            margin: 0;
            position: relative;
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Discontinued background logo */
        body::before {
            display: none;
        }

        /* Vertical mottos on sides */
        .motto {
            position: fixed;
            top: 50%;
            font-size: 24px;
            font-weight: 900;
            color: var(--accent);
            opacity: 0.8;
            text-transform: uppercase;
            pointer-events: none;
            white-space: nowrap;
            z-index: 5;
            letter-spacing: 5px;
        }
        .motto-left { left: -5px; transform: translateY(-50%) rotate(-90deg); }
        .motto-right { right: -5px; transform: translateY(-50%) rotate(90deg); }

        h1 { color: var(--primary); font-size: 28px; text-transform: uppercase; margin-bottom: 10px; }
        
        img.strip { 
            max-width: 90%; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            border: 8px solid white;
            margin-top: 10px;
            position: relative;
            z-index: 2;
        }

        p { font-weight: bold; margin-top: 20px; color: #64748b; }

        .btn { 
            display: inline-block; 
            margin-top: 25px; 
            padding: 18px 40px; 
            background: var(--accent); 
            color: white; 
            text-decoration: none; 
            border-radius: 50px; 
            font-weight: 900; 
            box-shadow: 0 5px 15px rgba(255, 145, 77, 0.4);
            text-transform: uppercase;
            position: relative;
            z-index: 2;
        }
    </style>
</head>
<body>
    <!-- Motto tags for mobile view -->
    <div class="motto motto-left">say cheese!</div>
    <div class="motto motto-right">siuuuuuuuu!</div>

    <h1>Save Your Memories ✨</h1>
    <img src="{{ strip_url }}" class="strip">
    <p>📷 Long press on the image to save to your phone!</p>
    <a href="/" class="btn">TAKE ANOTHER ONE 💫</a>
</body>
</html>
