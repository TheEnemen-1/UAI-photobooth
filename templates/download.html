<!DOCTYPE html>
<html>
<head>
    <title>Download Your Photo</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Share+Tech&display=swap" rel="stylesheet">
    <style>
        body { 
            text-align: center; 
            background: #e0f2fe; /* Light Blue */
            color: #1e293b; 
            font-family: 'Share Tech', sans-serif; 
            padding: 20px; 
            margin: 0;
        }
        h1 { 
            color: #0088cc; 
            font-size: 32px; 
            text-transform: uppercase; 
            font-family: 'Changa One', cursive, sans-serif; 
            letter-spacing: 1px;
        }
        img.strip { 
            max-width: 90%; 
            border-radius: 15px; 
            box-shadow: 0 10px 30px rgba(0,0,0,0.2); 
            border: 8px solid white;
            margin-top: 10px;
        }
        p { font-weight: bold; margin-top: 20px; color: #64748b; }
        .btn { 
            display: inline-block; 
            margin-top: 25px; 
            padding: 18px 40px; 
            background: #ff914d; /* Orange Accent */
            color: white; 
            text-decoration: none; 
            border-radius: 50px; 
            font-family: 'Changa One', cursive, sans-serif;
            font-size: 20px;
            letter-spacing: 1px;
            box-shadow: 0 5px 15px rgba(255, 145, 77, 0.4);
            text-transform: uppercase;
        }
    </style>
</head>
<body>
    <h1>Save Your Memories ✨</h1>
    <img src="{{ strip_url }}" class="strip">
    <p>📷 Long press on the image to save to your phone!</p>
    <a href="/" class="btn">TAKE ANOTHER ONE 💫</a>
</body>
</html>
