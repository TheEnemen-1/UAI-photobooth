<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>UAI Photobooth | USTH</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>

<body>
    <!-- Vertical side mottos -->
    <div class="motto motto-left">say cheese...</div>
    <div class="motto motto-right">siuuuuuuuu!</div>

    <div class="header-brand">
        <img src="/static/logo.png" alt="UAI Logo" class="brand-logo">
        <div class="brand-text">
            <h1>UAI photobooth</h1>
            <p>creating memories at USTH</p>
        </div>
    </div>

    <header class="topbar">
        <select id="cameraSelect" class="btn"></select>
        <button id="btnRefresh" class="btn">🔍 Detect Cameras</button>
        <button id="btnFlip" class="btn">🔄 Mirror Toggle</button>

        <!-- Timer Selection for capture delay -->
        <label class="btn">⏱ Timer:
            <select id="timerSelect"
                style="border:none; background:transparent; font-weight:bold; color:inherit; cursor:pointer;">
                <option value="3">3s</option>
                <option value="5">5s</option>
                <option value="7">7s</option>
            </select>
        </label>

        <label class="btn">🖼 Load PNG Frame <input type="file" id="frameInput" accept="image/png"
                style="display:none"></label>
    </header>

    <main id="cameraStage" class="stage">
        <div class="left-panel">
            <div class="camera-container">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="overlay"></canvas>
                <div id="flash" class="flash-effect"></div>
                <div id="countdown" class="hidden">3</div>
            </div>
            <div id="statusBadge" class="status-badge">Loading AI Engine...</div>
        </div>

        <div class="right-panel">
            <div class="thumb-grid">
                <div id="thumb1" class="thumb-item"></div>
                <div id="thumb3" class="thumb-item"></div>
                <div id="thumb2" class="thumb-item"></div>
                <div id="thumb4" class="thumb-item"></div>
            </div>
            <p style="text-align: center; color: var(--primary); font-weight: bold; text-transform: uppercase;">Recent
                Captures</p>
        </div>
    </main>

    <div id="resultWrap" class="result-wrap hidden">
        <img id="resultImg" src="">
        <div class="qr-box">
            <img id="qrImg" src="">
            <h4>SCAN QR TO GET YOUR PHOTO ✨</h4>
            <a id="downloadLink" target="_blank"
                style="color: var(--primary); font-weight: bold; text-decoration: none;">Or click here</a>
            <br><br>
            <button onclick="location.reload()" class="btn"
                style="background: var(--accent); color: white; width: 100%; border: none;">RETAKE 💫</button>
        </div>
    </div>

    <script type="module" src="/static/app.js"></script>
</body>

</html>
