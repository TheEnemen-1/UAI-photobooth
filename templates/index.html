<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>UAI Photobooth | USTH</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header-brand">
        <h1>UAI photobooth</h1>
        <p>creating memories at USTH</p>
    </div>

    <header class="topbar">
        <select id="cameraSelect" class="btn"></select>
        <button id="btnFlip" class="btn">🔄 Lật Mirror</button>
        <label class="btn">🖼 Tải Khung PNG <input type="file" id="frameInput" accept="image/png" style="display:none"></label>
    </header>

    <main id="cameraStage" class="stage">
        <div class="left-panel">
            <div class="camera-container">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="overlay"></canvas>
                <div id="flash" class="flash-effect"></div>
                <div id="countdown" class="hidden">3</div>
            </div>
            <div id="statusBadge" class="status-badge">Đang tải trí tuệ nhân tạo...</div>
        </div>

        <div class="right-panel">
            <div class="thumb-grid">
                <!-- Vị trí 1 (Dòng 1 cột 1) -->
                <div id="thumb1" class="thumb-item"></div>
                <!-- Vị trí 3 (Dòng 1 cột 2) -->
                <div id="thumb3" class="thumb-item"></div>
                <!-- Vị trí 2 (Dòng 2 cột 1) -->
                <div id="thumb2" class="thumb-item"></div>
                <!-- Vị trí 4 (Dòng 2 cột 2) -->
                <div id="thumb4" class="thumb-item"></div>
            </div>
            <p style="text-align: center; color: var(--primary); font-weight: bold;">ẢNH VỪA CHỤP</p>
        </div>
    </main>

    <div id="resultWrap" class="result-wrap hidden">
        <img id="resultImg" src="">
        <div class="qr-box">
            <img id="qrImg" src="">
            <h4>QUÉT QR LẤY ẢNH ✨</h4>
            <a id="downloadLink" target="_blank" style="color: var(--primary); font-weight: bold; text-decoration: none;">Hoặc bấm vào đây</a>
            <br><br>
            <button onclick="location.reload()" class="btn" style="background: var(--accent); color: white; width: 100%; border: none;">CHỤP LẠI</button>
        </div>
    </div>

    <script type="module" src="/static/app.js"></script>
</body>
</html>
