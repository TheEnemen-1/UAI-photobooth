<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>UAI Photobooth | USTH</title>
    <link rel="stylesheet" href="/static/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;900&display=swap" rel="stylesheet">
</head>
<body>
    <div class="header-brand">
        <h1>📸 UAI photobooth</h1>
        <p>Creating memories at USTH</p>
    </div>

    <header class="topbar">
        <select id="cameraSelect" class="btn"></select>
        <button id="btnFlip" class="btn">🔄 Flip Camera</button>
        <button id="btnSelectFrame" class="btn">🖼️ Select Frame</button>
    </header>

    <main id="cameraStage" class="stage">
        <div class="left-panel">
            <div class="camera-container">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="overlay"></canvas>
                <div id="flash" class="flash-effect"></div>
                <div id="countdown" class="hidden">3</div>
            </div>
            <div id="statusBadge" class="status-badge">Loading AI Engine...</div>
        </div>

        <div class="right-panel">
            <div class="thumb-grid">
                <div id="thumb1" class="thumb-item"></div>
                <div id="thumb3" class="thumb-item"></div>
                <div id="thumb2" class="thumb-item"></div>
                <div id="thumb4" class="thumb-item"></div>
            </div>
            <p style="text-align: center; color: var(--primary); font-weight: bold; text-transform: uppercase;">Recent Captures</p>
        </div>
    </main>

    <div id="resultWrap" class="result-wrap hidden">
        <img id="resultImg" src="">
        <div class="qr-box">
            <img id="qrImg" src="">
            <h4>SCAN QR TO GET YOUR PHOTO ✨</h4>
            <a id="downloadLink" target="_blank" style="color: var(--primary); font-weight: bold; text-decoration: none;">Or click here</a>
            <br><br>
            <button onclick="location.reload()" class="btn" style="background: var(--accent); color: white; width: 100%; border: none;">RETAKE 💫</button>
        </div>
    </div>

    <!-- Frame Picker Modal -->
    <div id="framePickerModal" class="modal-overlay hidden" role="dialog" aria-modal="true" aria-labelledby="framePickerTitle">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="framePickerTitle">🖼️ Select a Frame</h2>
                <button id="btnCloseFramePicker" class="modal-close" aria-label="Close">&times;</button>
            </div>
            <div id="framePickerGrid" class="frame-picker-grid">
                <p class="picker-loading">Loading frames…</p>
            </div>
            <div class="modal-footer">
                <button id="btnClearFrame" class="btn">✖ No Frame</button>
                <button id="btnConfirmFrame" class="btn btn-accent">✔ Apply</button>
            </div>
        </div>
    </div>

    <script type="module" src="/static/app.js"></script>
</body>
</html>
