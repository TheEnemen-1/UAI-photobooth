<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>UAI Photobooth | USTH</title>
    <link rel="icon" type="image/png" href="/static/logo.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Changa+One:ital@0;1&family=Share+Tech&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>

<body>
    <div class="header-brand">
        <h1><img src="/static/logo.png" alt="Logo" class="brand-logo"> UAI PHOTOBOOTH</h1>
        <p>Creating memories at USTH and UAI</p>
    </div>

    <header class="topbar">
        <select id="cameraSelect" class="btn"></select>
        <select id="timerSelect" class="btn">
            <option value="3">⏱️ 3s Timer</option>
            <option value="5">⏱️ 5s Timer</option>
            <option value="10">⏱️ 10s Timer</option>
        </select>
        <select id="soundSelect" class="btn">
            <option value="on">🔊 Sound ON</option>
            <option value="off">🔇 Sound OFF</option>
        </select>
        <button id="btnFlip" class="btn">🔄 Flip Camera</button>
        <button id="btnSelectFrame" class="btn">🖼️ Select Frame</button>
        <button id="btnStartCapture" class="btn btn-accent">📸 Start Capture</button>
    </header>

    <main id="cameraStage" class="stage">
        <div class="left-panel">
            <div class="camera-container">
                <video id="video" autoplay playsinline muted></video>
                <canvas id="overlay"></canvas>
                <div id="flash" class="flash-effect"></div>
                <div id="countdown" class="hidden">3</div>
            </div>
            <div id="statusBadge" class="status-badge">Loading AI Engine...</div>
        </div>

        <div class="right-panel">
            <div class="strip-preview-wrapper">
                <canvas id="stripPreviewCanvas"></canvas>
            </div>
            <p class="preview-title">Recent Captures</p>
        </div>
    </main>

    <div id="resultWrap" class="result-wrap hidden">
        <img id="resultImg" src="">
        <div class="qr-box">
            <img id="qrImg" src="">
            <h4>SCAN QR TO GET YOUR PHOTO ✨</h4>
            <a id="downloadLink" target="_blank"
                style="color: var(--primary); font-weight: bold; text-decoration: none;">Or click here</a>
            <br><br>
            <button onclick="location.reload()" class="btn"
                style="background: var(--accent); color: white; width: 100%; border: none;">RETAKE 💫</button>
        </div>
    </div>

    <!-- Frame Picker Modal -->
    <div id="framePickerModal" class="modal-overlay hidden" role="dialog" aria-modal="true"
        aria-labelledby="framePickerTitle">
        <div class="modal-box">
            <div class="modal-header">
                <h2 id="framePickerTitle">🖼️ Select a Frame</h2>
                <button id="btnCloseFramePicker" class="modal-close" aria-label="Close">&times;</button>
            </div>
            <div id="framePickerGrid" class="frame-picker-grid">
                <p class="picker-loading">Loading frames…</p>
            </div>
            <div class="modal-footer">
                <button id="btnClearFrame" class="btn">✖ No Frame</button>
                <button id="btnConfirmFrame" class="btn btn-accent">✔ Apply</button>
            </div>
        </div>
    </div>

    <script type="module" src="/static/app.js"></script>
</body>

</html>
