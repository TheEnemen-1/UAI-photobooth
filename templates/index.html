<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>AI Tech Photobooth</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
    <header class="topbar">
        <h3>📸 PHOTOBOOTH AI</h3>
        <select id="cameraSelect"></select>
        <button id="btnFlip" class="btn-control">🔄 Flip Camera</button>
        <label style="font-size: 12px;">Frame (PNG): <input type="file" id="frameInput" accept="image/png"></label>
    </header>

    <div id="cameraWrap">
        <div class="camera-container">
            <video id="video" class="mirrored" autoplay playsinline muted></video>
            <canvas id="overlay" class="mirrored"></canvas>
            <div id="countdown" class="hidden">3</div>
        </div>
        <div id="statusBadge" class="status-badge">Đang khởi tạo AI...</div>
    </div>

    <div id="resultWrap" class="result-wrap hidden">
        <img id="resultImg" src="">
        <div class="qr-box">
            <img id="qrImg" src="">
            <p>Quét QR để tải ảnh</p>
            <a id="downloadLink" target="_blank" style="color: blue;">Mở link tải ảnh</a>
            <br><br>
            <button onclick="location.reload()" class="btn-control">🔁 CHỤP LẠI</button>
        </div>
    </div>

    <script type="module" src="/static/app.js"></script>
</body>
</html>
