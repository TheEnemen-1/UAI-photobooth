<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>AI Photobooth</title>
<link rel="stylesheet" href="style.css" />
</head>
<body>
  <header class="topbar">
    <h1>📸 AI Photobooth</h1>
    <div class="controls">
      <label>Camera:
        <select id="cameraSelect"></select>
      </label>
      <label class="fileBtn">🕶 Chọn filter mặt
        <input type="file" id="filterInput" accept="image/png" />
      </label>
      <label class="fileBtn">🖼 Chọn khung ảnh (frame)
        <input type="file" id="frameInput" accept="image/png" />
      </label>
    </div>
  </header>

  <main class="stage">
    <div class="camera-wrap" id="cameraWrap">
      <video id="video" autoplay playsinline muted></video>
      <canvas id="overlay"></canvas>
      <div id="statusBadge" class="status-badge">Đưa 2 tay lên tạo khung hình chữ nhật để chụp ✋🖼✋</div>
      <div id="countdown" class="countdown hidden">3</div>
    </div>

    <div class="result-wrap hidden" id="resultWrap">
      <h2>Kết quả</h2>
      <img id="resultImg" alt="Ảnh kết quả" />
      <div class="qr-box">
        <img id="qrImg" alt="QR code" />
        <p>Quét QR để tải ảnh & video về điện thoại</p>
        <a id="downloadLink" href="#" target="_blank">Hoặc mở link tại đây</a>
      </div>
      <button id="retakeBtn">🔁 Chụp lại</button>
    </div>
  </main>

  <canvas id="captureCanvas" class="hidden"></canvas>

  <script type="module" src="app.js"></script>
</body>
</html>
